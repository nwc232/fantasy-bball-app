<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in · Category Lab</title>
<link rel="stylesheet" href="/static/style.css">
<style>
  body { min-height: 100vh; display: grid; place-items: center; }
  .login { width: min(360px, calc(100% - 32px)); background: var(--panel); border: 1px solid var(--line);
    border-radius: 14px; padding: 28px 26px; }
  .login .brand { margin-bottom: 18px; }
  .login label { display: flex; flex-direction: column; gap: 6px; font-size: 11px; text-transform: uppercase;
    letter-spacing: .06em; color: var(--muted); }
  .login input { font-size: 16px; padding: 10px 12px; }
  .login button { width: 100%; margin-top: 14px; padding: 11px; font-size: 15px; }
  .login .err { color: rgb(var(--bad)); font-size: 13px; min-height: 18px; margin-top: 10px; }
</style>
</head>
<body>
<form class="login" id="f" autocomplete="on">
  <div class="brand">
    <span class="logo" aria-hidden="true"></span>
    <div><h1>Category Lab</h1><p class="sub">Enter the site password</p></div>
  </div>
  <!-- hidden username helps password managers remember the password -->
  <input type="text" name="username" value="category-lab" autocomplete="username" hidden>
  <label>Password <input id="pw" type="password" name="password" autocomplete="current-password" autofocus required></label>
  <button class="primary" type="submit" id="go">Log in</button>
  <div class="err" id="err"></div>
  <p class="note">You'll stay logged in on this device for 30 days.</p>
</form>
<script>
document.getElementById("f").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = document.getElementById("go"), err = document.getElementById("err");
  btn.disabled = true; btn.textContent = "Checking…"; err.textContent = "";
  try {
    const r = await fetch("/api/login", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password: document.getElementById("pw").value }) });
    if (r.ok) { location.href = "/" + (location.hash || ""); return; }
    const j = await r.json().catch(() => ({}));
    err.textContent = j.detail || "Couldn't log in.";
  } catch { err.textContent = "Couldn't reach the server. It may be waking up; try again in a moment."; }
  btn.disabled = false; btn.textContent = "Log in";
});
</script>
</body>
</html>
